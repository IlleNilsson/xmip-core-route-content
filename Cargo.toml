[package]
name = "xmip-core-route-content"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-route-content"
description = "Content route technology: `content:<language>:<expression>` follows a path, compiled once through the xmip-core-path engine in whichever language it carries, into the first section's content, parsed once per Message, and reads the scalar it finds. A xmip-core-route technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). The Source trait lives in route and takes a Message.
route = { workspace = true }
message = { workspace = true }
# The path capability: the one engine a property's path compiles through,
# carrying whichever languages configuration loads, and the content parsed
# once per Message.
path = { workspace = true }
# The path languages a build links, each by its feature, which
# `ContentSource::linked` carries: the one list of them (ADR-0046, amendment
# 2026-11-11).
path_edi = { workspace = true, optional = true }

[features]
# `edi`: a segment, element and component of an EDIFACT or X12 interchange,
# `content:edi:UNH/2/1` the message type.
edi = ["dep:path_edi"]

[dev-dependencies]
# The tests write a filter as its expression.
expression = { workspace = true }
# The two JSON languages the tests load into the engine.
path_dot = { workspace = true }
path_jsonpath = { workspace = true }
# The error a test language refuses with.
contract = { workspace = true }
# Only the tests build a Message from its parts.
context = { workspace = true }
stream = { workspace = true }
xcore = { workspace = true }

[lints]
workspace = true
